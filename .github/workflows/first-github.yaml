name: My Github Workflows

#On push to the main branch, trigger the workflow below
on:
  push:
    branches: 
      - main

env:
  PROJECT_NAME: githubactions-demo
  COURSE: LLMOps by Navtesh Boiiii


jobs:
  myexamplejob:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Checkout the repo"
      - name: Checkout repo
        uses: actions/checkout@v4
      - run: printenv
      - run: echo "This is the env ${{ env.PROJECT_NAME }} and {{ env.COURSE }}"

